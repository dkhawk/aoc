<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Advent of Code - Master Calendar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700;800&family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0b0f19;
      --card-bg: rgba(18, 24, 38, 0.75);
      --card-hover: rgba(30, 41, 59, 0.85);
      --accent-gold: #fbbf24;
      --accent-gold-glow: rgba(251, 191, 36, 0.3);
      --accent-green: #10b981;
      --accent-blue: #3b82f6;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: rgba(255, 255, 255, 0.08);
      --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 15% 20%, rgba(251, 191, 36, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 85% 80%, rgba(59, 130, 246, 0.08) 0%, transparent 40%);
      color: var(--text-main);
      min-height: 100vh;
      padding-bottom: 60px;
    }

    /* Header & Stats Banner */
    header {
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 16px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 1.6rem;
      font-weight: 800;
      background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 50%, #d97706 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.5px;
    }

    .stats-bar {
      display: flex;
      gap: 24px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-color);
      border-radius: 50px;
      padding: 8px 20px;
    }

    .stat-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.9rem;
      font-weight: 600;
    }

    .stat-val {
      color: var(--accent-gold);
      font-family: 'Fira Code', monospace;
      font-size: 1rem;
    }

    /* Container */
    .container {
      max-width: 1400px;
      margin: 32px auto;
      padding: 0 24px;
    }

    /* Controls Bar */
    .controls {
      display: flex;
      flex-direction: column;
      gap: 20px;
      margin-bottom: 32px;
    }

    .year-tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 8px;
      scrollbar-width: thin;
    }

    .tab-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 8px 18px;
      border-radius: 12px;
      font-family: 'Outfit', sans-serif;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .tab-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      color: var(--text-main);
    }

    .tab-btn.active {
      background: linear-gradient(135deg, #fbbf24 0%, #d97706 100%);
      color: #0f172a;
      border-color: #fbbf24;
      box-shadow: 0 0 15px var(--accent-gold-glow);
    }

    .filter-bar {
      display: flex;
      gap: 16px;
      align-items: center;
      flex-wrap: wrap;
    }

    .search-box {
      flex: 1;
      min-width: 260px;
      position: relative;
    }

    .search-box input {
      width: 100%;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 10px 16px;
      color: var(--text-main);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-box input:focus {
      border-color: var(--accent-gold);
    }

    .filter-pills {
      display: flex;
      gap: 8px;
    }

    .pill {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .pill.active {
      background: rgba(255, 255, 255, 0.15);
      color: var(--text-main);
      border-color: rgba(255, 255, 255, 0.3);
    }

    /* Grid Layout */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
    }

    .day-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 20px;
      backdrop-filter: blur(12px);
      box-shadow: var(--glass-shadow);
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 150px;
    }

    .day-card:hover {
      transform: translateY(-4px);
      background: var(--card-hover);
      border-color: rgba(251, 191, 36, 0.4);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5), 0 0 20px var(--accent-gold-glow);
    }

    .day-card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .day-number {
      font-family: 'Outfit', sans-serif;
      font-size: 1.8rem;
      font-weight: 800;
      color: rgba(255, 255, 255, 0.3);
      line-height: 1;
    }

    .day-card:hover .day-number {
      color: var(--accent-gold);
    }

    .day-status-icon {
      font-size: 1.3rem;
    }

    .day-title {
      font-weight: 600;
      font-size: 0.95rem;
      margin-top: 12px;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .day-footer {
      margin-top: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .parts-badge {
      display: flex;
      gap: 4px;
    }

    .badge-part {
      width: 20px;
      height: 20px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.7rem;
      font-weight: 700;
    }

    .badge-part.done {
      background: rgba(16, 185, 129, 0.2);
      color: var(--accent-green);
      border: 1px solid rgba(16, 185, 129, 0.4);
    }

    .badge-part.pending {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-muted);
      border: 1px solid var(--border-color);
    }

    /* Modal */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(11, 15, 25, 0.85);
      backdrop-filter: blur(12px);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .modal-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      background: #131b2e;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px;
      max-width: 750px;
      width: 100%;
      max-height: 85vh;
      overflow-y: auto;
      padding: 32px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
      position: relative;
    }

    .modal-close {
      position: absolute;
      top: 20px;
      right: 20px;
      background: rgba(255, 255, 255, 0.08);
      border: none;
      color: var(--text-muted);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      transition: all 0.2s;
    }

    .modal-close:hover {
      background: rgba(255, 255, 255, 0.2);
      color: var(--text-main);
    }

    .modal-header {
      margin-bottom: 24px;
    }

    .modal-subtitle {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--accent-gold);
      font-weight: 700;
    }

    .modal-title {
      font-family: 'Outfit', sans-serif;
      font-size: 1.8rem;
      font-weight: 800;
      margin-top: 4px;
    }

    .title-link {
      color: inherit;
      text-decoration: none;
      transition: color 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .title-link:hover {
      color: var(--accent-gold);
    }

    .modal-header-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-top: 8px;
      flex-wrap: wrap;
    }

    .synopsis-sec {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      font-size: 0.95rem;
      line-height: 1.6;
      white-space: pre-wrap;
    }

    .synopsis-sec h3 {
      font-size: 1rem;
      color: var(--accent-gold);
      margin-bottom: 8px;
    }

    .code-box {
      background: #090d16;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 12px 16px;
      font-family: 'Fira Code', monospace;
      font-size: 0.85rem;
      color: #38bdf8;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 20px;
    }

    .btn-action {
      background: linear-gradient(135deg, #fbbf24 0%, #d97706 100%);
      color: #0f172a;
      border: none;
      padding: 10px 20px;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
    }

    .btn-action:hover {
      box-shadow: 0 0 15px var(--accent-gold-glow);
    }

    .aoc-direct-btn {
      background: rgba(59, 130, 246, 0.15);
      border: 1px solid rgba(59, 130, 246, 0.4);
      color: #60a5fa;
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: all 0.2s;
    }

    .aoc-direct-btn:hover {
      background: rgba(59, 130, 246, 0.3);
      color: #93c5fd;
      border-color: #60a5fa;
      box-shadow: 0 0 10px rgba(59, 130, 246, 0.3);
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <span style="font-size: 1.8rem;">🎄</span>
      <h1>Advent of Code Master Calendar</h1>
    </div>
    <div class="stats-bar">
      <div class="stat-item">
        <span>Total Stars:</span>
        <span class="stat-val" id="stat-stars">0</span> ⭐
      </div>
      <div class="stat-item">
        <span>Completed Days:</span>
        <span class="stat-val" id="stat-completed">0</span> 🌟
      </div>
      <div class="stat-item">
        <span>Years:</span>
        <span class="stat-val" id="stat-years">11</span>
      </div>
    </div>
  </header>

  <div class="container">
    <div class="controls">
      <div class="year-tabs" id="year-tabs">
        <!-- Year tabs rendered here -->
      </div>
      <div class="filter-bar">
        <div class="search-box">
          <input type="text" id="search-input" placeholder="Search problem titles or keywords...">
        </div>
        <div class="filter-pills" id="filter-pills">
          <button class="pill active" data-filter="all">All Days</button>
          <button class="pill" data-filter="complete">🌟 Both Parts</button>
          <button class="pill" data-filter="part1_only">⭐ Part 1 Only</button>
          <button class="pill" data-filter="unsolved">⭕ Unsolved</button>
        </div>
      </div>
    </div>

    <div class="grid" id="days-grid">
      <!-- Cards rendered here -->
    </div>
  </div>

  <!-- Day Detail Modal -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal-card">
      <button class="modal-close" id="modal-close">✕</button>
      <div class="modal-header">
        <div class="modal-subtitle" id="modal-subtitle">Advent of Code 2025 • Day 01</div>
        <div class="modal-header-actions">
          <a id="modal-title-link" href="#" target="_blank" rel="noopener noreferrer" class="title-link">
            <h2 class="modal-title" id="modal-title">Secret Entrance</h2>
          </a>
          <a id="modal-header-aoc-link" href="#" target="_blank" rel="noopener noreferrer" class="btn-action">
            🌐 Open Problem on AdventOfCode.com ↗
          </a>
        </div>
      </div>

      <div class="synopsis-sec">
        <h3>📖 Overview & Setup</h3>
        <div id="modal-setup"></div>
      </div>

      <div class="synopsis-sec" id="modal-p1-container">
        <h3>⭐ Part 1 Objective</h3>
        <div id="modal-p1"></div>
      </div>

      <div class="synopsis-sec" id="modal-p2-container">
        <h3>🎀 Part 2 Objective</h3>
        <div id="modal-p2"></div>
      </div>

      <div class="code-box">
        <span id="modal-kt-path">app/src/main/kotlin/...</span>
        <a id="modal-aoc-link" href="#" target="_blank" rel="noopener noreferrer" class="btn-action">Open on AoC ↗</a>
      </div>
    </div>
  </div>

  <script>
    let appData = { stats: {}, years: [], days: [] };
    let currentYear = 2025;
    let currentFilter = 'all';
    let searchQuery = '';

    async function loadData() {
      try {
        const resp = await fetch('data.json');
        appData = await resp.json();
        renderStats();
        renderYearTabs();
        renderGrid();
      } catch (err) {
        console.error("Failed to load data.json:", err);
      }
    }

    function renderStats() {
      document.getElementById('stat-stars').innerText = appData.stats.totalStars;
      document.getElementById('stat-completed').innerText = appData.stats.totalCompletedDays;
      document.getElementById('stat-years').innerText = appData.stats.yearsCount;
    }

    function renderYearTabs() {
      const container = document.getElementById('year-tabs');
      container.innerHTML = '';
      
      appData.years.slice().reverse().forEach(year => {
        const btn = document.createElement('button');
        btn.className = `tab-btn ${year === currentYear ? 'active' : ''}`;
        btn.innerText = year;
        btn.onclick = () => {
          currentYear = year;
          document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          renderGrid();
        };
        container.appendChild(btn);
      });
    }

    function renderGrid() {
      const grid = document.getElementById('days-grid');
      grid.innerHTML = '';

      const filtered = appData.days.filter(d => {
        if (d.year !== currentYear) return false;
        if (currentFilter !== 'all' && d.status !== currentFilter) return false;
        if (searchQuery && !d.title.toLowerCase().includes(searchQuery) && !d.setup.toLowerCase().includes(searchQuery)) return false;
        return true;
      });

      if (filtered.length === 0) {
        grid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 40px;">No matching Advent of Code days found.</div>`;
        return;
      }

      filtered.forEach(day => {
        const card = document.createElement('div');
        card.className = 'day-card';
        card.innerHTML = `
          <div>
            <div class="day-card-header">
              <div class="day-number">Day ${day.dayPadded}</div>
              <div class="day-status-icon">${day.symbol}</div>
            </div>
            <div class="day-title">${day.title}</div>
          </div>
          <div class="day-footer">
            <div class="parts-badge">
              <div class="badge-part ${day.part1Complete ? 'done' : 'pending'}">P1</div>
              <div class="badge-part ${day.part2Complete ? 'done' : 'pending'}">P2</div>
            </div>
            <a href="${day.aocUrl}" target="_blank" rel="noopener noreferrer" class="aoc-direct-btn" onclick="event.stopPropagation();">AoC ↗</a>
          </div>
        `;
        card.onclick = () => openModal(day);
        grid.appendChild(card);
      });
    }

    function openModal(day) {
      document.getElementById('modal-subtitle').innerText = `Advent of Code ${day.year} • Day ${day.dayPadded}`;
      document.getElementById('modal-title').innerText = `${day.symbol} ${day.title} ↗`;
      document.getElementById('modal-title-link').href = day.aocUrl;
      document.getElementById('modal-header-aoc-link').href = day.aocUrl;
      document.getElementById('modal-aoc-link').href = day.aocUrl;

      document.getElementById('modal-setup').innerText = day.setup || "No synopsis available.";
      
      const p1Container = document.getElementById('modal-p1-container');
      if (day.part1Synopsis) {
        p1Container.style.display = 'block';
        document.getElementById('modal-p1').innerText = day.part1Synopsis;
      } else {
        p1Container.style.display = 'none';
      }

      const p2Container = document.getElementById('modal-p2-container');
      if (day.part2Synopsis) {
        p2Container.style.display = 'block';
        document.getElementById('modal-p2').innerText = day.part2Synopsis;
      } else {
        p2Container.style.display = 'none';
      }

      document.getElementById('modal-kt-path').innerText = day.ktPath || "Solution file not created yet";
      document.getElementById('modal-overlay').classList.add('open');
    }

    document.getElementById('modal-close').onclick = () => {
      document.getElementById('modal-overlay').classList.remove('open');
    };

    document.getElementById('modal-overlay').onclick = (e) => {
      if (e.target.id === 'modal-overlay') {
        document.getElementById('modal-overlay').classList.remove('open');
      }
    };

    document.getElementById('search-input').oninput = (e) => {
      searchQuery = e.target.value.toLowerCase();
      renderGrid();
    };

    document.querySelectorAll('.pill').forEach(pill => {
      pill.onclick = () => {
        document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
        pill.classList.add('active');
        currentFilter = pill.dataset.filter;
        renderGrid();
      };
    });

    loadData();
  </script>
</body>
</html>
